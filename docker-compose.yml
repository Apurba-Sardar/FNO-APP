services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: fno
      POSTGRES_USER: fno
      POSTGRES_PASSWORD: fno
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fno"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: always
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://fno:fno@postgres:5432/fno}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TRADING_MODE: ${TRADING_MODE:-live}
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-true}
      LIVE_STAGE: ${LIVE_STAGE:-3}
      LIVE_OPERATOR_TOKEN: ${LIVE_OPERATOR_TOKEN:-LIVE_OPERATOR_TOKEN_2026}
      LIVE_EMERGENCY_TOKEN: ${LIVE_EMERGENCY_TOKEN:-LIVE_EMERGENCY_TOKEN_2026}
      LIVE_TRADING_CONFIRMATION: ${LIVE_TRADING_CONFIRMATION:-LIVE_CONFIRM_SAFE_2026}
      NTFY_TOPIC: ${NTFY_TOPIC:-fno_trades_apurba}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./backend/app:/app/app
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build: ./frontend
    restart: always
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
