[project]
name = "fno-scanner"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.10,<4",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.5,<3",
  "python-socketio[asyncio_client]>=5.11,<6",
  "redis>=5,<6",
  "sqlalchemy[asyncio]>=2,<3",
  "structlog>=24,<26",
  "uvicorn[standard]>=0.30,<1",
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "respx>=0.21,<1", "ruff>=0.7,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
[tool.ruff]
line-length = 100
target-version = "py311"
